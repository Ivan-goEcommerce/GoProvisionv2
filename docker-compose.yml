services:
  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.https.conf:ro
      - ./nginx/nginx.http.conf:/etc/nginx/templates/nginx.http.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    command: >
      /bin/sh -c '
      cert_dir="/etc/letsencrypt/live/goprovision.goecloud.eu";
      if [ -f "$$cert_dir/fullchain.pem" ] && [ -f "$$cert_dir/privkey.pem" ]; then
        cp /etc/nginx/templates/nginx.https.conf /etc/nginx/nginx.conf;
        echo "[reverse-proxy] TLS certificate found. Starting with HTTPS.";
      else
        cp /etc/nginx/templates/nginx.http.conf /etc/nginx/nginx.conf;
        echo "[reverse-proxy] TLS certificate missing. Starting in HTTP-only mode.";
      fi;
      nginx -g "daemon off;";
      '
    restart: on-failure:3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    expose:
      - "8000"
    restart: on-failure:3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      - backend
    expose:
      - "3000"
    restart: on-failure:3
